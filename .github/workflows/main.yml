name: open-swe-docker-hub
on:
  workflow_dispatch:
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: bobbintb
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get UnRAID version
        run: |
          pwd
          ls -ls
          docker build -t bobbintb/unraid-open-swe .
          docker push bobbintb/unraid-open-swe
          docker build -t bobbintb/unraid-open-swe:latest .
          docker push bobbintb/unraid-open-swe:latest
